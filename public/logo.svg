<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Pick &amp; Pay">
  <defs>
    <linearGradient id="pp-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="pp-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="10" y="10" width="220" height="220" rx="56" fill="#0a0a0c" />
  <rect x="10" y="10" width="220" height="220" rx="56" fill="none" stroke="url(#pp-frame)" stroke-width="4" filter="url(#pp-glow)" />

  <g filter="url(#pp-glow)">
    <circle cx="112" cy="136" r="52" fill="none" stroke="#a855f7" stroke-width="6" />
    <path d="M60 118a56 56 0 0 1 24-34" fill="none" stroke="#4ade80" stroke-width="6" stroke-linecap="round" />
    <path d="M170 152a56 56 0 0 1-22 32" fill="none" stroke="#4ade80" stroke-width="6" stroke-linecap="round" />

    <g stroke="#22c55e" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M126 96 L176 46" />
      <path d="M112 82 L140 54" opacity="0" />
    </g>
    <g transform="rotate(-45 150 70)">
      <rect x="118" y="56" width="64" height="26" rx="9" fill="none" stroke="#22c55e" stroke-width="7" />
      <rect x="146" y="82" width="9" height="74" rx="4.5" fill="none" stroke="#22c55e" stroke-width="7" />
    </g>

    <g stroke="#4ade80" stroke-width="6" stroke-linecap="round">
      <path d="M86 60 L94 70" />
      <path d="M108 44 L112 57" />
      <path d="M196 96 L184 102" />
      <path d="M186 74 L176 82" />
    </g>
    <g stroke="#a855f7" stroke-width="6" stroke-linecap="round">
      <path d="M62 172 L52 182" />
      <path d="M158 190 L166 200" />
    </g>
  </g>

  <text x="112" y="140" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="38" font-weight="700" fill="#ffffff" filter="url(#pp-glow)">WIN</text>
  <text x="112" y="168" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="19" font-weight="700" letter-spacing="3" fill="#4ade80" filter="url(#pp-glow)">DRAFT</text>
</svg>
